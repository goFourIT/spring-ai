global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'otel-collector' # scrape metrics from the OpenTelemetry Collector
    static_configs:
      - targets: ['otel-collector:8888']
  - job_name: 'prometheus' # scrape Prometheus' own metrics
    static_configs:
      - targets: ['localhost:9090']